server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /ws {
        proxy_pass http://backend:8080;
        # Both headers are required for nginx to upgrade the connection to a WebSocket.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        # nginx closes proxied connections after 60s without traffic by default, which
        # would drop every idle chat. The client reconnects and syncs, but this avoids
        # the churn. (Same trap exists on an AWS ALB: its idle timeout is also 60s.)
        proxy_read_timeout 3600s;
    }

    # React single-page app: unknown paths fall back to index.html.
    location / {
        try_files $uri /index.html;
    }
}