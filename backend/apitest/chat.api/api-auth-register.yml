info:
  name: /api/auth/register
  type: http
  seq: 1

http:
  method: post
  url: http://localhost:8080/api/auth/register
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "username": "bob",
        "password": "password321"
      }
  auth: inherit

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
